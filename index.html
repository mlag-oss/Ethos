<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
<meta charset="utf-8">

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link rel="stylesheet" href="css/styles.css">

<body class="font-body-md text-on-surface bg-background">

<div id="login-screen">

    <h1 style="font-family:'Hanken Grotesk';font-size:26px;font-weight:700;color:#182a1d;margin-bottom:0.4rem;letter-spacing:-0.02em">Ethos AI</h1>

    <div id="g-signin-btn" style="display:flex;justify-content:center;min-height:44px;align-items:center">
      <div style="font-family:Inter;font-size:13px;color:#c3c8c1">Carregando...</div>
    </div>
    <p style="font-family:Inter;font-size:11px;color:#c3c8c1;margin-top:2rem;line-height:1.6">
